---
- name: Patch port configuration on JTCom switch
  hosts: localhost
  connection: local
  gather_facts: false
  check_mode: true
  no_log: true

  vars:
    switch_host: http://192.0.2.10
    switch_user: "{{ lookup('env', 'SWITCH_USER') | default('admin', true) }}"
    switch_pass: "{{ lookup('env', 'SWITCH_PASS') }}"

  tasks:
    - name: Set speed/duplex and enable/disable ports
      bronweg.cgiswitch.jtcom_config:
        host: "{{ switch_host }}"
        username: "{{ switch_user }}"
        password: "{{ switch_pass }}"
        ports:
          1:
            admin_up: true
            speed: Auto
            flow_control: false
          2:
            admin_up: true
            speed: 1000M/Full
          3:
            admin_up: false
