---
- name: Create VLANs referenced by port configuration
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    switch_host: 192.0.2.1
    switch_user: "{{ lookup('env', 'SWITCH_USER') | default('admin', true) }}"
    switch_pass: "{{ lookup('env', 'SWITCH_PASS') }}"

  tasks:
    - name: Create VLAN 61 when it is absent and use it for port 3
      bronweg.cgiswitch.jtcom_config:
        host: "{{ switch_host }}"
        username: "{{ switch_user }}"
        password: "{{ switch_pass }}"
        # Without this option, an undeclared missing reference fails validation.
        auto_create_referenced_vlans: true
        ports:
          3:
            access_vlan: 61
