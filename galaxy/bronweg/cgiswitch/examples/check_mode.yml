---
- name: Preview JTCom changes without writing the switch
  hosts: localhost
  connection: local
  gather_facts: false
  check_mode: true
  no_log: true

  vars:
    switch_host: http://192.0.2.10
    switch_user: "{{ lookup('env', 'SWITCH_USER') | default('admin', true) }}"
    switch_pass: "{{ lookup('env', 'SWITCH_PASS') }}"

  tasks:
    - name: Preview a port patch and VLAN membership change
      bronweg.cgiswitch.jtcom_config:
        host: "{{ switch_host }}"
        username: "{{ switch_user }}"
        password: "{{ switch_pass }}"
        # Make the preview intentionally hit the protected-port policy.
        safety_port_id: 3
        vlans:
          61:
            state: present
        ports:
          3:
            access_vlan: 61
            admin_up: false
      register: jtcom_preview

    - name: Show planned operations and any policy violations
      no_log: false
      ansible.builtin.debug:
        msg:
          diff: "{{ jtcom_preview.diff | default({}) }}"
          operations: "{{ jtcom_preview.operations | default([]) }}"
          violations: "{{ jtcom_preview.violations | default([]) }}"
          blocked: "{{ jtcom_preview.blocked | default(false) }}"
