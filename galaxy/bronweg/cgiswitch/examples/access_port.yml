---
- name: Configure an access port on JTCom switch
  hosts: localhost
  connection: local
  gather_facts: false
  check_mode: true
  no_log: true

  vars:
    switch_host: http://192.0.2.10
    switch_user: "{{ lookup('env', 'SWITCH_USER') | default('admin', true) }}"
    switch_pass: "{{ lookup('env', 'SWITCH_PASS') }}"

  tasks:
    - name: Put port 3 into access VLAN 20
      bronweg.cgiswitch.jtcom_config:
        host: "{{ switch_host }}"
        username: "{{ switch_user }}"
        password: "{{ switch_pass }}"
        vlans:
          20:
            state: present
        ports:
          3:
            # access_vlan also clears any existing tagged memberships.
            access_vlan: 20
