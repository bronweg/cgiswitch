name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]" 'ansible-core>=2.15'
      - name: Reject non-English tracked content
        run: python tools/check_language.py
      - name: Run Ruff
        run: ruff check .
      - name: Run Mypy
        run: mypy src
      - name: Run tests
        run: pytest
      - name: Build Python distribution
        run: python -m build --outdir "${{ runner.temp }}/python-dist"
      - name: Build Galaxy collection
        run: ansible-galaxy collection build --force --output-path "${{ runner.temp }}/galaxy-dist" galaxy/bronweg/cgiswitch
      - name: Validate installed collection documentation and examples
        run: |
          ansible-galaxy collection install "${{ runner.temp }}"/galaxy-dist/*.tar.gz --force
          ansible-doc bronweg.cgiswitch.jtcom_config
          ansible-playbook -i localhost, --syntax-check galaxy/bronweg/cgiswitch/examples/*.yml
